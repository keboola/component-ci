# Monorepo publish on version change (keboola/components docs/release.md). For each app with `publish: true` whose
# version in component.yml rose on main (its own `version`, or the folder's): re-check the live tag and ECR, build, push
# the semver image, set the tag in the Developer Portal, sync component_config/. Credentials come only from the
# caller's release-<vendor> environments, which allow only `main`. An app with `imageFrom` runs another app's image:
# job `follow` sets only its tag, after `publish` pushed the image.
#
# Caller: `publish` on push to main (paths components/*/component.yml) and workflow_dispatch, with `secrets: inherit`.
# The caller decides whether a push publishes (its PUBLISH_ENABLED switch) and passes `folder` on a dispatch. A
# workflow_dispatch run is a dry run of that folder: it builds the image, checks the version against the live tag and
# ECR, and lists what it would sync, but pushes and writes nothing. `kit-path` as in monorepo-ci.yml.
name: monorepo-publish
on:
  workflow_call:
    inputs:
      kit-path:
        description: Where the kit is; `.` in the kit itself, else a subfolder that gets the kit's `main`
        type: string
        default: "."
      folder:
        description: Folder to dry-run (components/<folder>); only on workflow_dispatch
        type: string
        default: ""
permissions:
  contents: read
env:
  KIT: ${{ inputs.kit-path }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      follow: ${{ steps.plan.outputs.follow }}
    steps:
      - uses: keboola/component-ci/actions/monorepo/checkout@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          kit_ssh_key: ${{ secrets.PUBLIC_KIT_DEPLOY_KEY }}
          fetch_depth: "0"
      - id: plan
        env:
          FOLDER: ${{ inputs.folder }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            args=(--folder "$FOLDER")
          else
            args=(--before "$BEFORE" --after "$GITHUB_SHA")
          fi
          matrix=$("$KIT/tools/release" publish-plan "${args[@]}")
          follow=$("$KIT/tools/release" publish-plan "${args[@]}" --follow)
          {
            echo "matrix=$matrix"
            echo "follow=$follow"
          } >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq .
          echo "tag only (imageFrom):"; echo "$follow" | jq .

  publish:
    needs: plan
    if: fromJSON(needs.plan.outputs.matrix).include[0] != null
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release-${{ matrix.vendor }}
    # one publish per app at a time; a second one waits instead of racing
    concurrency:
      group: publish-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: keboola/component-ci/actions/monorepo/checkout@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          kit_ssh_key: ${{ secrets.PUBLIC_KIT_DEPLOY_KEY }}
      - id: tag
        uses: keboola/component-ci/actions/monorepo/release-tag@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          version: ${{ matrix.version }}
          dry_run: ${{ env.DRY_RUN }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
      - uses: keboola/component-ci/actions/monorepo/ecr-tag@monorepo-workflows
        with:
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          tag: ${{ steps.tag.outputs.tag }}
          expect: absent
          hint: raise the version in a new PR
          dry_run: ${{ env.DRY_RUN }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
      - uses: keboola/component-ci/actions/monorepo/build@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          folder: ${{ matrix.folder }}
          app_id: ${{ matrix.app }}
          vars_json: ${{ toJSON(vars) }}
          secrets_json: ${{ toJSON(secrets) }}
          dockerhub_user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: What a publish would sync
        env:
          FOLDER: ${{ matrix.folder }}
          APP: ${{ matrix.app }}
        run: '"$KIT/tools/release" properties "$FOLDER" "$APP"'
      - name: Push the image to ECR
        if: env.DRY_RUN != 'true'
        uses: keboola/action-push-to-ecr@030b1c82e3c3e3581e858dee90d51f5bf007c0ae
        with:
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
          tag: ${{ steps.tag.outputs.tag }}
          source_image: ${{ matrix.app }}
          push_latest: "true"
      - if: env.DRY_RUN != 'true'
        uses: keboola/component-ci/actions/monorepo/set-tag@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          tag: ${{ steps.tag.outputs.tag }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
      - if: env.DRY_RUN != 'true'
        uses: keboola/component-ci/actions/monorepo/sync-properties@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          folder: ${{ matrix.folder }}
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}

  # Apps with `imageFrom`: the image is the one `publish` pushed for the image app; only the tag moves. Runs after
  # `publish`, also when it had nothing to build.
  follow:
    needs: [plan, publish]
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.follow).include[0] != null && needs.publish.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.follow) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-${{ matrix.vendor }}
    concurrency:
      group: publish-${{ matrix.app }}
      cancel-in-progress: false
    steps:
      - uses: keboola/component-ci/actions/monorepo/checkout@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          kit_ssh_key: ${{ secrets.PUBLIC_KIT_DEPLOY_KEY }}
      - name: Version equals the image app's version
        env:
          APP: ${{ matrix.app }}
          IMAGE_APP: ${{ matrix.imageApp }}
          VERSION: ${{ matrix.version }}
          IMAGE_VERSION: ${{ matrix.imageVersion }}
        run: |
          if [ "$VERSION" != "$IMAGE_VERSION" ]; then
            echo "::error::$APP runs the image of $IMAGE_APP: version $VERSION must equal $IMAGE_VERSION"
            exit 1
          fi
      - id: tag
        uses: keboola/component-ci/actions/monorepo/release-tag@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          version: ${{ matrix.version }}
          dry_run: ${{ env.DRY_RUN }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
      - uses: keboola/component-ci/actions/monorepo/ecr-tag@monorepo-workflows
        with:
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          tag: ${{ steps.tag.outputs.tag }}
          expect: present
          hint: ${{ matrix.imageApp }} must publish it first
          dry_run: ${{ env.DRY_RUN }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
      - name: What a publish would sync
        env:
          FOLDER: ${{ matrix.folder }}
          APP: ${{ matrix.app }}
        run: '"$KIT/tools/release" properties "$FOLDER" "$APP"'
      - if: env.DRY_RUN != 'true'
        uses: keboola/component-ci/actions/monorepo/set-tag@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          tag: ${{ steps.tag.outputs.tag }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
      - if: env.DRY_RUN != 'true'
        uses: keboola/component-ci/actions/monorepo/sync-properties@monorepo-workflows
        with:
          kit_path: ${{ inputs.kit-path }}
          folder: ${{ matrix.folder }}
          vendor: ${{ matrix.vendor }}
          app_id: ${{ matrix.app }}
          kbc_developerportal_username: ${{ vars.KBC_DEVELOPERPORTAL_USERNAME }}
          kbc_developerportal_password: ${{ secrets.KBC_DEVELOPERPORTAL_PASSWORD }}
