name: Monorepo set tag
description: Set the app's tag in the Developer Portal, then check that the live tag is the new one.
inputs:
  kit_path:
    description: Where the kit is
    default: "."
  vendor:
    description: Developer Portal vendor
    required: true
  app_id:
    description: App ID
    required: true
  tag:
    description: Tag to set
    required: true
  kbc_developerportal_username:
    description: Developer Portal username
    required: true
  kbc_developerportal_password:
    description: Developer Portal password
    required: true
runs:
  using: composite
  steps:
    - name: Set the tag in the Developer Portal
      uses: keboola/action-set-tag-developer-portal@f1cb9641fbb4a144cf68170bc1e219dd99c29f96
      with:
        vendor: ${{ inputs.vendor }}
        app_id: ${{ inputs.app_id }}
        username: ${{ inputs.kbc_developerportal_username }}
        password: ${{ inputs.kbc_developerportal_password }}
        tag: ${{ inputs.tag }}
    - name: The live tag is the new one
      shell: bash
      env:
        KIT: ${{ inputs.kit_path }}
        VENDOR: ${{ inputs.vendor }}
        APP: ${{ inputs.app_id }}
        TAG: ${{ inputs.tag }}
        KBC_DEVELOPERPORTAL_USERNAME: ${{ inputs.kbc_developerportal_username }}
        KBC_DEVELOPERPORTAL_PASSWORD: ${{ inputs.kbc_developerportal_password }}
      run: |
        live=$("$KIT/tools/release" live-tag "$VENDOR" "$APP")
        if [ "$live" != "$TAG" ]; then
          echo "::error::live tag of $APP is '$live', expected '$TAG'"
          exit 1
        fi
